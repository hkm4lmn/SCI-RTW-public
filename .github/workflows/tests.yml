# Runs the API tests and builds the frontend on every push and pull request.
# The browser walkthrough (tests/ui_walkthrough.py) is not run here: it needs
# both servers running and is meant to be run by hand.
name: tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The version the models were trained with (models/evaluation_report.json).
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python -m pytest tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
